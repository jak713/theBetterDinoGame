[project]
name = "group3-group-project"
version = "0.1.0"
description = "Chrome offline dino game clone"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mysql-connector-python>=9.7.0",
    "pygame>=2.6.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "coverage>=7.0",
    "ruff>=0.9",
]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
